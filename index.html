<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>
<body>

  <!-- Warning Banner (shown when LocalStorage is unavailable or data is corrupt) -->
  <div id="warning-banner" class="warning-banner" role="alert" aria-live="polite" hidden>
    <span id="warning-message"></span>
    <button id="warning-close" type="button" aria-label="Dismiss warning">&times;</button>
  </div>

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
  </header>

  <main>

    <!-- Balance Display -->
    <section id="balance-display" aria-label="Total Balance">
      <h2>Total Balance</h2>
      <p id="balance-amount">0.00</p>
    </section>

    <!-- Input Form -->
    <section>
      <h2>Add Expense</h2>
      <form id="expense-form" novalidate>
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input
            type="text"
            id="item-name"
            name="item-name"
            maxlength="100"
            autocomplete="off"
            aria-required="true"
            placeholder="e.g. Lunch"
          />
          <span class="field-error" id="item-name-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            max="999999999.99"
            step="0.01"
            aria-required="true"
            placeholder="e.g. 12.50"
          />
          <span class="field-error" id="amount-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" aria-required="true">
            <option value="">-- Select Category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="field-error" id="category-error" role="alert"></span>
        </div>

        <button type="submit">Add Transaction</button>
        <span class="form-error" id="form-error" role="alert"></span>
      </form>
    </section>

    <!-- Transaction List -->
    <section>
      <h2>Transactions</h2>
      <ul id="transaction-list" aria-label="Transaction list" aria-live="polite">
        <!-- Transactions rendered here by js/app.js -->
      </ul>
    </section>

    <!-- Pie Chart -->
    <section>
      <h2>Spending by Category</h2>
      <div id="pie-chart-container">
        <canvas id="pie-chart-canvas" aria-label="Spending distribution pie chart" role="img"></canvas>
        <p id="pie-chart-placeholder" class="chart-placeholder">No spending data available.</p>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
